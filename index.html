<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>My Todo List</h1>
      <button id="theme-toggle" class="theme-btn">Toggle Dark Mode</button>
    </header>
    <main>
      <div class="container">
        <aside class="todo-list">
          <h2>Todos</h2>
          <input
            type="text"
            id="todo-search"
            class="search-box"
            placeholder="Search todo..."
          />
          <ul id="todo-ul"></ul>
        </aside>
        <section class="todo-detail">
          <h2>Todo Details</h2>
          <form id="todo-form">
            <label for="todo-title">Title:</label>
            <input
              type="text"
              id="todo-title"
              name="todo-title"
              placeholder="Enter todo title"
            />
            <label for="todo-description">Description:</label>

            <textarea
              id="todo-description"
              name="todo-description"
              placeholder="Enter todo description"
            ></textarea>
            <label for="todo-due">Due Date:</label>
            <input type="date" id="todo-due" name="todo-due" />
            <button type="submit">Add Todo</button>
          </form>
        </section>
      </div>
    </main>
    <footer>
      <p>&copy; PemWeb Todo List App</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
